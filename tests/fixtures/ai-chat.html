<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f4f6fb; color: #20232a; font-family: system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    .conversation { min-height: 280px; padding: 24px; border-radius: 18px; background: white; box-shadow: 0 12px 36px rgba(20, 28, 48, 0.08); }
    .message { width: fit-content; max-width: 78%; margin-bottom: 14px; padding: 12px 16px; border-radius: 14px; background: #edf1f9; }
    .message.user { margin-left: auto; background: #dfe9ff; }
    .composer { display: flex; align-items: flex-end; gap: 8px; margin-top: 18px; padding: 10px; border: 1px solid #d7dce8; border-radius: 16px; background: white; }
    textarea, [contenteditable="true"] { min-height: 64px; flex: 1; resize: vertical; border: 0; outline: 0; padding: 10px; font: inherit; }
    button[type="submit"] { width: 40px; height: 40px; border: 0; border-radius: 10px; background: #3259d6; color: white; }
  </style>
</head>
<body>
  <main>
    <section class="conversation" aria-label="Conversation">
      <div class="message user">I am working on a JavaScript utility.</div>
      <div class="message assistant">What would you like help with?</div>
    </section>
    <form class="composer">
      <textarea aria-label="Message" placeholder="Message the assistant"></textarea>
      <button type="button" aria-label="Attach file">+</button>
      <button type="button" aria-label="Voice mode">●</button>
      <button type="submit" aria-label="Send">➜</button>
    </form>
  </main>
  <script>
    document.querySelector('form').addEventListener('submit', (event) => event.preventDefault());
  </script>
</body>
</html>
